services:
  postgres:
    image: postgres:16
    container_name: poker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DOCKER_POSTGRES_USER:-poker}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-poker}
      POSTGRES_DB: ${DOCKER_POSTGRES_DB:-poker}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poker -d poker']
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: steinente/poker-server:latest
    container_name: poker-server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://poker:poker@postgres:5432/poker}
      PORT: ${DOCKER_SERVER_PORT:-3000}
      CLIENT_UI_URL: ${DOCKER_CLIENT_UI_URL:-http://localhost:8080}
      HOST_DISCONNECT_TIMEOUT_MS: ${DOCKER_HOST_DISCONNECT_TIMEOUT_MS:-180000}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '${DOCKER_SERVER_PORT:-3000}'

  client-ui-ssr:
    image: steinente/poker-client-ui-ssr:latest
    container_name: poker-client-ui-ssr
    restart: unless-stopped
    environment:
      PORT: 4000
    depends_on:
      - server
    expose:
      - '4000'

  client-ui:
    build:
      context: .
      dockerfile: apps/client-ui/Dockerfile
    container_name: poker-client-ui
    restart: unless-stopped
    depends_on:
      - client-ui-ssr
      - server
    ports:
      - '8081:80'

volumes:
  postgres_data:
